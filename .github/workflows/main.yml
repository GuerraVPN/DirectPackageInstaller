name: Build the DPI Android

on:
  workflow_dispatch:
  push:
    branches: [ DN8 ]

concurrency:
  group: dpi-android
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --licenses < /dev/null || true
          sdkmanager "platform-tools" "ndk;24.0.8215888"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Android workload
        run: |
          set -euo pipefail
          dotnet workload install android

      - name: Build Android
        env:
          BUILD_TARGETS: android
        run: |
          set -euo pipefail
          chmod +x Build.cmd
          git submodule status
          ./Build.cmd

      - name: List release files
        run: |
          set -euo pipefail
          find Release -maxdepth 3 -type f -print
          find Release -type f -name '*.apk' -print

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: DirectPackageInstaller-Android15
          path: |
            Release/**/*.apk
            Release/**/*.zip
          if-no-files-found: error
