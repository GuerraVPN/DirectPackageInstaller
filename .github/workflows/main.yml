name: Build the DPI Android

on:
  workflow_dispatch:
  push:
    branches: [ DN8 ]

concurrency:
  group: dpi-android
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; Android SDK layout:"
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f | head -100 || true
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdkmanager --licenses < /dev/null || true
          sdkmanager "platform-tools" "ndk;24.0.8215888"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Android workload
        run: |
          set -euo pipefail
          dotnet workload install android

      - name: Build Android
        env:
          BUILD_TARGETS: android
        run: |
          set -euo pipefail
          chmod +x Build.cmd
          git submodule status
          ./Build.cmd

      - name: Sign Android APK
        run: |
          set -euo pipefail
          APK_SIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          if [ -z "$APK_SIGNER" ]; then
            echo "apksigner not found"
            find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -print || true
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/dpi-debug.keystore"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          mapfile -t APKS < <(find Release -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK found in Release"
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            "$APK_SIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --out "$APK.signed" \
              "$APK"
            mv "$APK.signed" "$APK"
            "$APK_SIGNER" verify --verbose "$APK"
          done

      - name: List release files
        run: |
          set -euo pipefail
          find Release -maxdepth 4 -type f -print
          find Release -type f -name '*.apk' -print

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: DirectPackageInstaller-Android15
          path: |
            Release/**/*.apk
            Release/**/*.zip
          if-no-files-found: error
